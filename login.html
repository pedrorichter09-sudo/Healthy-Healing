<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Healthy Healing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .login-box {
            max-width: 420px; margin: 80px auto; background: white;
            padding: 40px; border-radius: 20px; box-shadow: 0 0 20px rgba(0, 0, 0, .08);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <h2 class="text-center mb-4">Entrar</h2>

        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

        <form action="login.php" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100">Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
</div>

<script>
    // Avisos de erro vindos do servidor (?erro=codigo)
    const MENSAGENS = {
        credenciais: "E-mail ou senha incorretos.",
        banco: "Erro ao conectar ao banco de dados. Verifique se o MySQL do XAMPP está ligado."
    };
    const codigo = new URLSearchParams(location.search).get("erro");
    if (codigo && MENSAGENS[codigo]) {
        const alerta = document.getElementById("alerta");
        alerta.textContent = MENSAGENS[codigo];
        alerta.classList.remove("d-none");
    }
</script>
</body>
</html>
