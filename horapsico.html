<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamento - Healthy Healing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background:#f5f7fa;
}
.box{
max-width:850px;
margin:50px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.08);
}
.turno{
border:1px solid #d8d8d8;
padding:25px;
border-radius:15px;
}
.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
    border:3px solid #d6d6d6;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-success navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Health Hearling</a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" href="index.html">Início</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle"
             href="#"
             role="button"
             data-bs-toggle="dropdown">

           Tratamentos
          </a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Nutricionista</a></li>
            <li><a class="dropdown-item" href="#">Fisioterapia</a></li>
            <li><a class="dropdown-item" href="#">Psicologia</a></li>
            <li><a class="dropdown-item" href="#">Fonoaudiologia</a></li>
          </ul>
        </li>

      </ul>

      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Pesquisar">
        <button class="btn btn-outline-light type="submit">
          Buscar
        </button>
      </form>

    </div>
  </div>
</nav>

<div class="container">
<div class="box">
<div class="text-center mb-5">
<img
   src="psicoterapia logo nova-bola.png"
   class="logo"
   alt="Logo">

<h2 class="mt-3">
Agendamento de Consulta</h2>
<p class="text-muted">
Escolha um profissional por turno</p>

</div>
<form>
<div class="mb-4">
<label class="form-label">
Data da consulta
</label>
<input
type="date"
class="form-control">
</div>

<div class="row g-4">

<!-- MATUTINO -->
<div class="col-md-6">
<div class="turno">
<h4>Turno da Manhã</h4>

<label class="form-label">
Profissional 
</label>

<select class="form-select">

<option selected>
Selecione
</option>

<option>Dra. Duarda — Psicológa</option>

<option>Dra. Fernanda — Psicóloga</option>
</select>
<br>

<label class="form-label">
Horário
</label>

<select class="form-select">

<option>08:00</option>
<option>09:00</option>
<option>10:00</option>
<option>11:00</option>
</select>
</div>
</div>

<!-- NORTUNO  -->

<div class="col-md-6">

<div class="turno">

<h4>Turno da Noite</h4>

<label class="form-label">
Profissional</label>

<select class="form-select">

<option selected>Selecione</option>
<option>Dra. Roberta — Psicóloga</option>
<option>Dra. Daniella — Psicóloga</option>
</select>
<br>
<label class="form-label">
Horário
</label>

<select class="form-select">

<option>18:00</option>
<option>19:00</option>
<option>20:00</option>
<option>21:00</option>

</select>
</div>
</div>
</div>
<div class="d-grid mt-5">

<a href="index.html"
class="btn btn-success btn-lg">
Confirmar Agendamento</a>

</div>

</div>
