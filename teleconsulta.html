<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Teleconsulta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            color: #2d3748;
        }
       .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
       .header {
            background: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }
       .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
       .header p { opacity: 0.9; font-size: 0.9rem; }
       .form {
            padding: 24px;
        }
       .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
        }
       .horarios {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
       .horario {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
       .horario:hover { border-color: #2563eb; }
       .horario.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
       .horario.ocupado {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #15803d; }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
       .sucesso {
            display: none;
            padding: 24px;
            text-align: center;
        }
       .sucesso.show { display: block; }
       .sucesso h2 { color: #16a34a; margin-bottom: 12px; }
       .resumo {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            margin: 16px 0;
        }
       .resumo p { margin-bottom: 8px; }
       .aviso {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Agendar Teleconsulta</h1>
            <p>Atendimento médico online em minutos</p>
        </div>

        <form class="form" id="formConsulta">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
            </div>

            <div class="form-group">
                <label for="especialidade">Especialidade</label>
                <select id="especialidade" required>
                    <option value="">Selecione...</option>
                    <option value="Clínico Geral">Clínico Geral</option>
                    <option value="Pediatria">Pediatria</option>
                    <option value="Dermatologia">Dermatologia</option>
                    <option value="Psicologia">Psicologia</option>
                    <option value="Nutrição">Nutrição</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data">Data da consulta</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group">
                <label>Horários disponíveis</label>
                <div class="horarios" id="horarios">
                    <div class="horario" data-hora="08:00">08:00</div>
                    <div class="horario" data-hora="09:00">09:00</div>
                    <div class="horario ocupado" data-hora="10:00">10:00</div>
                    <div class="horario" data-hora="11:00">11:00</div>
                    <div class="horario" data-hora="14:00">14:00</div>
                    <div class="horario" data-hora="15:00">15:00</div>
                    <div class="horario ocupado" data-hora="16:00">16:00</div>
                    <div class="horario" data-hora="17:00">17:00</div>
                    <div class="horario" data-hora="18:00">18:00</div>
                </div>
                <input type="hidden" id="horaSelecionada" required>
            </div>

            <div class="form-group">
                <label for="sintomas">Descreva seus sintomas</label>
                <textarea id="sintomas" rows="3" placeholder="Ex: dor de cabeça há 2 dias, febre..."></textarea>
            </div>

            <button type="submit" id="btnAgendar">Confirmar Agendamento</button>
            <p class="aviso">Esta é uma simulação. Nenhum agendamento real será feito.</p>
        </form>

        <div class="sucesso" id="telaSucesso">
            <h2>✓ Teleconsulta Agendada!</h2>
            <p>Você receberá o link da consulta por SMS e email.</p>
            <div class="resumo" id="resumo"></div>
            <button onclick="window.location.reload()">Agendar outra consulta</button>
        </div>
    </div>

    <script>
        // Data mínima = hoje
        document.getElementById('data').min = new Date().toISOString().split('T')[0];

        // Máscara CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });

        // Selecionar horário
        document.querySelectorAll('.horario').forEach(el => {
            if (!el.classList.contains('ocupado')) {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.horario').forEach(h => h.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('horaSelecionada').value = this.dataset.hora;
                });
            }
        });

        // Submit
        document.getElementById('formConsulta').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!document.getElementById('horaSelecionada').value) {
                alert('Selecione um horário disponível');
                return;
            }

            const dados = {
                nome: document.getElementById('nome').value,
                especialidade: document.getElementById('especialidade').value,
                data: new Date(document.getElementById('data').value + 'T00:00:00').toLocaleDateString('pt-BR'),
                hora: document.getElementById('horaSelecionada').value
            };

            document.getElementById('resumo').innerHTML = `
                <p><strong>Paciente:</strong> ${dados.nome}</p>
                <p><strong>Especialidade:</strong> ${dados.especialidade}</p>
                <p><strong>Data:</strong> ${dados.data} às ${dados.hora}</p>
                <p><strong>Local:</strong> Link será enviado 10min antes</p>
            `;

            document.getElementById('formConsulta').style.display = 'none';
            document.getElementById('telaSucesso').classList.add('show');
        });
    </script>
</body>
</html>
